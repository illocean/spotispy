<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Spotispy - watch public Spotify profiles and playlists, locally">
  <rect width="1280" height="640" fill="#0d0d0d"/>
  <!-- faint hairline grid, echoing the UI surface -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 160h1280M0 320h1280M0 480h1280"/>
    <path d="M320 0v640M640 0v640M960 0v640"/>
  </g>
  <!-- mark -->
  <g transform="translate(96 132)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="#121212" stroke="#1ed760" stroke-opacity="0.30" stroke-width="2"/>
    <path d="M20 60c10-16 25-24 40-24s30 8 40 24c-10 16-25 24-40 24S30 76 20 60Z"
          fill="none" stroke="#ffffff" stroke-opacity="0.94" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="60" cy="60" r="17" fill="#1ed760"/>
    <circle cx="60" cy="60" r="7" fill="#121212"/>
    <path d="M40 100c11 6 29 6 40 0" fill="none" stroke="#1ed760" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- wordmark -->
  <text x="252" y="212" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="88" font-weight="800" letter-spacing="-1.5" fill="#ffffff">Spotispy</text>
  <!-- tagline -->
  <text x="254" y="272" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="30" font-weight="400" fill="#a7a7a7">Watch public Spotify profiles and playlists, locally.</text>
  <!-- chips -->
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="600">
    <rect x="254" y="330" width="290" height="52" rx="26" fill="#121212" stroke="#1ed760" stroke-opacity="0.35"/>
    <text x="278" y="363" fill="#1ed760">No third-party accounts</text>
    <rect x="564" y="330" width="140" height="52" rx="26" fill="#121212" stroke="#1ed760" stroke-opacity="0.35"/>
    <text x="588" y="363" fill="#1ed760">No cost</text>
    <rect x="724" y="330" width="210" height="52" rx="26" fill="#121212" stroke="#1ed760" stroke-opacity="0.35"/>
    <text x="748" y="363" fill="#1ed760">No telemetry out</text>
  </g>
  <!-- footer hairline -->
  <rect x="96" y="560" width="1088" height="1" fill="#ffffff" fill-opacity="0.08"/>
  <text x="96" y="602" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="20" fill="#8f8f8f">A local-only Spicetify extension and custom app.</text>
</svg>